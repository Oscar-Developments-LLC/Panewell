<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>New tab</title>
  <style>
    :root {
      --bg: #f3f3f5; --card: #ffffff; --fg: #1b1b1f;
      --muted: #61616b; --border: #d5d5dc; --accent: #2f6df6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101012; --card: #1c1c20; --fg: #ececf0;
        --muted: #9a9aa4; --border: #2c2c33; --accent: #5b8dff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { width: min(560px, 88vw); text-align: center; margin-top: -8vh; }
    h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.3px; }
    p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%; height: 44px; padding: 0 18px;
      border: 1px solid var(--border); border-radius: 22px;
      background: var(--card); color: var(--fg); font: inherit; outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .links {
      margin-top: 22px; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px;
    }
    a.link {
      padding: 14px 8px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--fg); text-decoration: none;
      font-size: 12.5px; transition: border-color .12s ease, transform .12s ease;
    }
    a.link:hover { border-color: var(--accent); transform: translateY(-1px); }
    .tip { margin-top: 26px; color: var(--muted); font-size: 12px; }
    kbd {
      padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); font-size: 11.5px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Panewell</h1>
    <p class="sub">Fullscreen fills this window, not your whole screen.</p>

    <input id="q" type="text" placeholder="Search or enter a web address"
           autofocus spellcheck="false" aria-label="Search or enter a web address" />

    <div class="links">
      <a class="link" href="https://www.youtube.com">YouTube</a>
      <a class="link" href="https://www.netflix.com">Netflix</a>
      <a class="link" href="https://www.twitch.tv">Twitch</a>
      <a class="link" href="https://www.espn.com">ESPN</a>
      <a class="link" href="https://www.reddit.com">Reddit</a>
    </div>

    <p class="tip">Press <kbd>F11</kbd> to fill the window &middot;
       drag the empty tab-bar space to move &middot; drag edges to resize</p>
  </div>

  <script>
    document.getElementById('q').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var text = e.target.value.trim();
      if (!text) return;
      var isUrl = /^[a-z][a-z0-9+\-.]*:\/\//i.test(text) ||
                  /^[^\s/]+\.[^\s/]{2,}(\/|$|:)/.test(text);
      location.href = isUrl
        ? (/:\/\//.test(text) ? text : 'https://' + text)
        : 'https://duckduckgo.com/?q=' + encodeURIComponent(text);
    });
  </script>
</body>
</html>
